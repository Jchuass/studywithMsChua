<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Questions Viewer</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding: 24px; }
    #status { margin-bottom: 12px; color: #333; }
    #error { color: #b00020; margin-bottom: 12px; white-space: pre-wrap; }
    #questions { margin-top: 12px; display: grid; gap: 8px; }
    .q { padding: 10px; border: 1px solid #e6e6e6; border-radius: 6px; background: #fafafa; }
    .meta { font-size: 12px; color: #666; margin-top: 6px; }
    button { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Questions</h1>
  <div id="status">Initializing...</div>
  <div id="error" role="alert"></div>
  <button id="reload">Reload questions</button>
  <div id="questions"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // -------------------------
    // CONFIGURE THESE VALUES
    // -------------------------
    const SUPABASE_URL = 'https://mwwdiarsgsblmgesjrpi.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable_JLTBnYzvGs5A66H8NR881A_1Wr3tmEm'
    // -------------------------

    // Create client with the public anon key only
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const statusEl = document.getElementById('status')
    const errorEl = document.getElementById('error')
    const questionsEl = document.getElementById('questions')
    const reloadBtn = document.getElementById('reload')

    reloadBtn.addEventListener('click', () => {
      loadQuestions()
    })

    async function loadQuestions() {
      statusEl.textContent = 'Loading questions...'
      errorEl.textContent = ''
      questionsEl.innerHTML = ''

      try {
        // Use the client library to call the public REST endpoint
        const { data, error, status } = await supabase
          .from('questions')
          .select('*')

        if (error) {
          errorEl.textContent = `Supabase error: ${error.message} (status ${status})`
          statusEl.textContent = 'Failed to load questions'
          console.error('Supabase error details:', error)
          return
        }

        if (!Array.isArray(data)) {
          errorEl.textContent = 'Unexpected response shape from Supabase. Check endpoint and keys.'
          statusEl.textContent = 'Failed to load questions'
          console.error('Unexpected data:', data)
          return
        }

        if (data.length === 0) {
          statusEl.textContent = 'No questions found'
          return
        }

        statusEl.textContent = `Loaded ${data.length} question(s)`
        data.forEach((row) => {
          const div = document.createElement('div')
          div.className = 'q'
          const title = row.title ?? row.question ?? 'Untitled question'
          const body = row.body ?? row.description ?? ''
          div.innerHTML = `
            <div class="title"><strong>${escapeHtml(title)}</strong></div>
            <div class="body">${escapeHtml(body)}</div>
            <div class="meta">id: ${escapeHtml(String(row.id ?? ''))}</div>
          `
          questionsEl.appendChild(div)
        })
      } catch (err) {
        // Network or CORS failure will surface here in the browser
        errorEl.textContent = `Network or CORS error: ${err.message || err}`
        statusEl.textContent = 'Failed to load questions'
        console.error('Fetch error:', err)
      }
    }

    // Small helper to avoid injecting raw HTML
    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;')
    }

    // Run on load
    loadQuestions()
  </script>
</body>
</html>
